name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Configure official socket server
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const filePath = './public/js/client.class.js';
          const source = fs.readFileSync(filePath, 'utf8');

          const original = 'static #SOCKET_SERVER = null;';
          const replacement = "static #SOCKET_SERVER = 'https://wad-together.fly.dev/';";

          fs.writeFileSync(filePath, source.replace(original, replacement));
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5